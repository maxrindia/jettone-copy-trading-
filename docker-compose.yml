services:
  nginx:
    image: nginx:alpine
    container_name: copytrade_nginx
    # Host ports 80/443 are intentionally NOT bound here: this VPS already
    # runs a host-level Nginx on 80/443 serving other production domains
    # (api.maxr.io, flow.maxr.in, automation.maxr.in) - binding here would
    # conflict with it. Jettone is reached directly via NextJS's own
    # "3000:3000" mapping below (http://<VPS_IP>:3000), which does not
    # depend on this service at all. This container (and certbot) are kept
    # for a future scenario where Jettone gets its own dedicated domain -
    # re-add the ports mapping (on a host that isn't already using 80/443)
    # if that happens. See docker-compose.yml history / project notes for
    # the port-conflict this avoided.
    # ports:
    #   - "80:80"
    #   - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    # nginx itself never re-reads certificate files on its own; this
    # reload loop is what picks up a renewed certificate from the certbot
    # service without needing Docker-socket access from that container.
    command: >
      /bin/sh -c "while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      - nextjs
    restart: unless-stopped
    networks:
      - frontend_net

  certbot:
    image: certbot/certbot:latest
    container_name: copytrade_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Renewal only - initial issuance is a one-time manual step, see
    # nginx/init-letsencrypt.sh (certbot needs nginx already serving the
    # ACME HTTP-01 challenge path, and no certificate exists yet on first
    # boot, so it can't be part of this automatic loop).
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    networks:
      - frontend_net

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: copytrade_nextjs
    ports:
      - "3005:3000"
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - TRADING_ENGINE_URL=http://fastapi:8000
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - TWO_FACTOR_ENABLED=${TWO_FACTOR_ENABLED:-false}
      - NEXT_PUBLIC_VPS_IP=${STATIC_VPS_IP:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend_net
      - backend_net

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: copytrade_fastapi
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ALICE_BLUE_ENCRYPTION_KEY=${ALICE_BLUE_ENCRYPTION_KEY}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENGINE_LIVE_TRADING_ENABLED=${ENGINE_LIVE_TRADING_ENABLED:-false}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend_net

  postgres:
    image: postgres:16-alpine
    container_name: copytrade_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    container_name: copytrade_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - backend_net

volumes:
  postgres_data:
    name: copytrade_postgres_data
  redis_data:
    name: copytrade_redis_data
  certbot_etc:
    name: copytrade_certbot_etc
  certbot_var:
    name: copytrade_certbot_var
  certbot_webroot:
    name: copytrade_certbot_webroot

networks:
  frontend_net:
    name: copytrade_frontend_net
  backend_net:
    name: copytrade_backend_net
