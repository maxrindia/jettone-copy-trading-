events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Server blocks (HTTP->HTTPS redirect + ACME challenge, and the HTTPS
    # TLS-terminating vhost) live in /etc/nginx/conf.d/, rendered from
    # nginx/templates/default.conf.template by the official nginx:alpine
    # entrypoint's envsubst step (DOMAIN_NAME is the only variable it needs;
    # nginx's own $host/$scheme/etc. runtime variables are never touched
    # since envsubst only substitutes names present in the container's
    # actual environment).
    include /etc/nginx/conf.d/*.conf;
}
